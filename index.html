<!doctype html>
<html lang="fr" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- seo -->
    <!-- Title, description and link-preview tags are added here at build time (scripts/seo.ts) -->
    <!-- /seo -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      // Day or night before the page shows (no white flash): saved choice, else the system setting.
      // The switch itself is src/components/ThemeToggle.tsx.
      var theme; try { theme = localStorage.getItem('theme'); } catch (e) {}
      document.documentElement.dataset.theme = theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    </script>
    <meta name="theme-color" content="#e7e3db" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#131211" media="(prefers-color-scheme: dark)" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <!-- Loading screen (first visit only): styles in public/loader.css, logic in public/loader.js -->
    <link rel="stylesheet" href="/loader.css" />
  </head>
  <body>
    <div id="loader" aria-hidden="true">
      <div class="loader-content">
        <p class="loader-name">Hadi Ayoub</p>
        <p class="loader-role">Développeur Full-Stack Junior</p>
        <p class="loader-stack">Java · Spring Boot · React · AI</p>
        <div class="loader-bar"><span></span></div>
        <p class="loader-status"><span class="loader-step"></span><span class="loader-pct">0%</span></p>
      </div>
    </div>
    <script src="/loader.js"></script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
